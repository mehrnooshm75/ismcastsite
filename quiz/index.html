<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>قطب‌نمای سیاسی</title>
  <style>
    /* ==========================================
       تنظیمات اصلی و واکنش‌گرایی
       ========================================== */
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Tahoma, Vazir, system-ui, -apple-system, sans-serif;
      background-color: #f4f6f9;
      color: #333;
      margin: 0;
      padding: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      background: #ffffff;
      padding: 16px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 420px; /* مناسب برای تمام موبایل‌ها */
      text-align: center;
    }

    h2 {
      margin: 0 0 16px 0;
      color: #1a2b4c;
      font-size: 1.25rem;
    }

    /* ==========================================
       باکس قطب‌نما (ریسپانسیو با aspect-ratio)
       ========================================== */
    .compass-wrapper {
      position: relative;
      width: 100%;
      max-width: 320px;
      /* ساخت مربع کاملاً پاسخگو */
      aspect-ratio: 1 / 1;
      margin: 10px auto 20px auto;
      background-color: #f8fafc;
      border-radius: 12px;
    }

    .compass-box {
      position: absolute;
      /* ایجاد فاصله مناسب از اطراف برای جا شدن برچسب‌ها */
      top: 36px;
      bottom: 36px;
      left: 36px;
      right: 36px;
      border: 2px solid #334155;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      overflow: hidden;
      border-radius: 6px;
    }

    /* چهار ربع قطب‌نما */
    .quadrant {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: bold;
      opacity: 0.85;
      user-select: none;
      text-align: center;
      padding: 2px;
      line-height: 1.2;
    }

    .q-tl { background-color: #fca5a5; color: #7f1d1d; } /* چپ اقتدارگرا */
    .q-tr { background-color: #93c5fd; color: #1e3a8a; } /* راست اقتدارگرا */
    .q-bl { background-color: #fde047; color: #713f12; } /* چپ آزادی‌خواه */
    .q-br { background-color: #86efac; color: #14532d; } /* راست آزادی‌خواه */

    /* محورها */
    .axis-v {
      position: absolute;
      top: 0;
      left: 50%;
      width: 2px;
      height: 100%;
      background-color: #334155;
      transform: translateX(-50%);
      z-index: 1;
    }

    .axis-h {
      position: absolute;
      top: 50%;
      left: 0;
      width: 100%;
      height: 2px;
      background-color: #334155;
      transform: translateY(-50%);
      z-index: 1;
    }

    /* برچسب‌های محورها (تنظیم فواصل جهت نلغزیدن در موبایل) */
    .axis-label {
      position: absolute;
      font-size: 0.75rem;
      font-weight: bold;
      color: #1e293b;
      white-space: nowrap;
    }

    .label-top { top: 10px; left: 50%; transform: translateX(-50%); }
    .label-bottom { bottom: 10px; left: 50%; transform: translateX(-50%); }
    .label-left { left: 2px; top: 50%; transform: translateY(-50%); }
    .label-right { right: 2px; top: 50%; transform: translateY(-50%); }

    /* نقطه نماینده با اندازه مناسب لمس و دید در موبایل */
    .compass-dot {
      position: absolute;
      width: 16px;
      height: 16px;
      background-color: #ef4444;
      border: 2px solid #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 6px rgba(0,0,0,0.4);
      z-index: 10;
      transform: translate(-50%, -50%);
      transition: left 0.4s cubic-bezier(0.4, 0, 0.2, 1), top 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* کنترل‌ها و نتیجه */
    #result-text {
      margin: 12px 0;
      font-size: 0.9rem;
      font-weight: bold;
      color: #0f172a;
      background: #f1f5f9;
      padding: 10px;
      border-radius: 8px;
    }

    .btn {
      background-color: #2563eb;
      color: white;
      border: none;
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: bold;
      font-family: inherit;
      touch-action: manipulation;
    }

    .btn:active {
      background-color: #1d4ed8;
      transform: scale(0.98);
    }

    /* بهبود فونت برای گوشی‌های خیلی کوچک */
    @media (max-width: 360px) {
      .axis-label, .quadrant {
        font-size: 0.65rem;
      }
      .compass-wrapper {
        margin: 5px auto 15px auto;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>نتیجه قطب‌نمای سیاسی</h2>

    <!-- wrapper قطب‌نما با dir="ltr" جهت حفظ محاسبات ریاضی درست -->
    <div class="compass-wrapper" dir="ltr">
      <span class="axis-label label-top">اقتدارگرایی</span>
      <span class="axis-label label-bottom">آزادی‌خواهی</span>
      <span class="axis-label label-left">اقتصاد چپ</span>
      <span class="axis-label label-right">اقتصاد راست</span>
      
      <div class="compass-box">
        <div class="axis-v"></div>
        <div class="axis-h"></div>
        
        <div class="quadrant q-tl">چپ<br>اقتدارگرا</div>
        <div class="quadrant q-tr">راست<br>اقتدارگرا</div>
        <div class="quadrant q-bl">چپ<br>آزادی‌خواه</div>
        <div class="quadrant q-br">راست<br>آزادی‌خواه</div>

        <div id="compass-dot" class="compass-dot" style="left: 50%; top: 50%;"></div>
      </div>
    </div>

    <div id="result-text">موقعیت شما: مرکز (میانه)</div>

    <button class="btn" onclick="testRandomPosition()">تست نقطه تصادفی</button>
  </div>

  <script>
    function updateCompassDot(x, y) {
      // محدوده حداقل و حداکثر امتیاز سیستم شما
      const minX = -60, maxX = 60;
      const minY = -60, maxY = 60;

      // تبدیل موقعیت به درصد
      let posX = ((x - minX) / (maxX - minX)) * 100;
      let posY = ((maxY - y) / (maxY - minY)) * 100;

      // مهار نقطه داخل کادر
      posX = Math.max(4, Math.min(96, posX));
      posY = Math.max(4, Math.min(96, posY));

      const dot = document.getElementById('compass-dot');
      dot.style.left = posX + '%';
      dot.style.top = posY + '%';

      updateResultText(x, y);
    }

    function updateResultText(x, y) {
      let eco = x > 0 ? "راست‌گرای اقتصادی" : (x < 0 ? "چپ‌گرای اقتصادی" : "میانه‌رو");
      let soc = y > 0 ? "اقتدارگرا" : (y < 0 ? "آزادی‌خواه" : "میانه");
      
      document.getElementById('result-text').innerText = `گرایش: ${eco} / ${soc} (X: ${x}, Y: ${y})`;
    }

    function testRandomPosition() {
      const randomX = Math.floor(Math.random() * 121) - 60;
      const randomY = Math.floor(Math.random() * 121) - 60;
      updateCompassDot(randomX, randomY);
    }
  </script>
</body>
</html>
