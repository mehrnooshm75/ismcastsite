<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نتیجه تست قطب‌نمای فکری - ایسم‌کست</title>
  
  <!-- کتابخانه html2canvas برای ساخت عکس -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  
  <style>
    /* استایل‌های کلی صفحه */
    body {
      margin: 0;
      padding: 20px;
      background-color: #0f1218;
      color: #ffffff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    /* کارت خروجی (بخش قابل دانلود) */
    #export-container {
      width: 100%;
      max-width: 480px;
      background-color: #161a22;
      border-radius: 20px;
      padding: 30px 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      text-align: center;
      box-sizing: border-box;
      border: 1px solid #2a2f3d;
      position: relative;
      margin-bottom: 24px;
    }

    /* تثبیت محاسبه اندازه تمام عناصر داخل کارت */
    #export-container * {
      box-sizing: border-box !important;
    }

    .brand-header {
      font-size: 1.1rem;
      color: #8b949e;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }

    #result-title {
      font-size: 1.5rem;
      font-weight: 800;
      color: #58a6ff;
      margin: 0 0 20px 0;
    }

    /* بخش پرتره */
    .portrait-wrapper {
      margin: 15px auto;
      width: 110px;
      height: 110px;
      border-radius: 50%;
      overflow: hidden;
      border: 3px solid #58a6ff;
      box-shadow: 0 4px 12px rgba(88, 166, 255, 0.3);
    }

    .portrait-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* بخش نمودار قطب‌نما (ابعاد ثابت برای جلوگیری از بهم‌ریختگی موبایل) */
    .compass-wrapper {
      width: 280px !important;
      height: 280px !important;
      margin: 20px auto !important;
      position: relative;
      background: #21262d;
      border-radius: 12px;
      border: 2px solid #30363d;
    }

    .compass-box {
      width: 100% !important;
      height: 100% !important;
      position: relative;
    }

    /* محورها */
    .axis-h {
      position: absolute;
      top: 50%;
      left: 0;
      width: 100%;
      height: 2px;
      background-color: #484f58;
    }

    .axis-v {
      position: absolute;
      left: 50%;
      top: 0;
      width: 2px;
      height: 100%;
      background-color: #484f58;
    }

    /* نقطه نتیجه روی نمودار */
    .compass-point {
      position: absolute;
      width: 14px;
      height: 14px;
      background-color: #f0883e;
      border: 2px solid #ffffff;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 10px #f0883e;
      top: 35%; /* جایگاه نمونه روی محور Y */
      left: 65%; /* جایگاه نمونه روی محور X */
    }

    .watermark {
      font-size: 0.85rem;
      color: #6e7681;
      margin-top: 15px;
    }

    /* دکمه‌ها و بخش اشتراک‌گذاری */
    .share-actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      max-width: 480px;
    }

    .btn {
      padding: 14px 20px;
      font-size: 1rem;
      font-weight: 700;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-family: inherit;
    }

    .btn-download {
      background-color: #238636;
      color: #ffffff;
    }

    .btn-download:hover {
      background-color: #2ea043;
    }

    .social-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
    }

    .btn-secondary {
      background-color: #21262d;
      color: #c9d1d9;
      border: 1px solid #30363d;
      font-size: 0.9rem;
    }

    .btn-secondary:hover {
      background-color: #30363d;
    }
  </style>
</head>
<body>

  <!-- کارت خروجی جهت تصویربرداری -->
  <div id="export-container">
    <div class="brand-header">ISMCAST • ایسم‌کست</div>
    <h2 id="result-title">سوسیال دمکرات متمايل به چپ</h2>
    
    <div class="portrait-wrapper">
      <img src="figures/marx.png" alt="پرتره نتیجه" onerror="this.src='https://via.placeholder.com/110';">
    </div>

    <div class="compass-wrapper">
      <div class="compass-box">
        <div class="axis-h"></div>
        <div class="axis-v"></div>
        <div class="compass-point"></div>
      </div>
    </div>

    <div class="watermark">podcast.ismcast.com | قطب‌نمای فکری</div>
  </div>

  <!-- اکشن‌ها و دکمه‌ها -->
  <div class="share-actions">
    <button class="btn btn-download" onclick="downloadInstagramStory(event)">
      📥 دانلود کارت استوری اینستاگرام
    </button>

    <div class="social-buttons">
      <button class="btn btn-secondary" onclick="shareTelegram()">تلگرام</button>
      <button class="btn btn-secondary" onclick="shareTwitter()">توییتر</button>
      <button class="btn btn-secondary" onclick="copyResultLink()">کپی لینک</button>
    </div>
  </div>

  <script>
    // تابع دانلود بدون بهم‌ریختگی در موبایل
    function downloadInstagramStory(e) {
      const exportArea = document.getElementById('export-container');
      const btn = e.currentTarget;
      const originalBtnText = btn.innerText;

      btn.innerText = "⏳ در حال ساخت عکس...";
      btn.disabled = true;

      // ۱. حفظ ابعاد فعلی برای بازگرداندن پس از دانلود
      const originalWidth = exportArea.style.width;
      const originalMaxWidth = exportArea.style.maxWidth;

      // ۲. قفل کردن موقت ابعاد کارت روی عرض استاندارد برای جلوگیری از فشرده‌سازی در مرورگر موبایل
      exportArea.style.width = '550px';
      exportArea.style.maxWidth = 'none';

      // ۳. ساخت عکس با html2canvas
      html2canvas(exportArea, {
        scale: 2,           // رزولوشن بالا برای استوری
        useCORS: true,      // پشتیبانی از لود تصاویر پرتره
        backgroundColor: '#161a22',
        logging: false,
        windowWidth: 1200   // شبیه‌سازی عرض دسکتاپ
      }).then(canvas => {
        // ۴. بازگرداندن ابعاد کارت به حالت Responsive اصلی
        exportArea.style.width = originalWidth;
        exportArea.style.maxWidth = originalMaxWidth;

        // ۵. دانلود فایل PNG
        const link = document.createElement('a');
        link.download = 'IsmCast-Political-Compass.png';
        link.href = canvas.toDataURL('image/png', 1.0);
        link.click();

        btn.innerText = originalBtnText;
        btn.disabled = false;
      }).catch(err => {
        // بازگرداندن استایل در صورت بروز خطا
        exportArea.style.width = originalWidth;
        exportArea.style.maxWidth = originalMaxWidth;

        console.error("خطا در دانلود عکس:", err);
        alert("مشکلی در ساخت عکس پیش آمد. در صورت تکرار می‌توانید اسکرین‌شات بگیرید.");
        btn.innerText = originalBtnText;
        btn.disabled = false;
      });
    }

    // تابع اشتراک‌گذاری در تلگرام
    function shareTelegram() {
      const title = document.getElementById('result-title').innerText;
      const text = `نتیجه تست قطب‌نمای فکری من در ایسم‌کست: ${title}\nشما هم تست بدهید:`;
      const url = window.location.href;
      window.open(`https://t.me/share/url?url=${encodeURIComponent(url)}&text=${encodeURIComponent(text)}`, '_blank');
    }

    // تابع اشتراک‌گذاری در توییتر
    function shareTwitter() {
      const title = document.getElementById('result-title').innerText;
      const text = `نتیجه تست قطب‌نمای فکری من در ایسم‌کست: ${title}`;
      const url = window.location.href;
      window.open(`https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}&url=${encodeURIComponent(url)}`, '_blank');
    }

    // تابع کپی لینک نتیجه
    function copyResultLink() {
      const title = document.getElementById('result-title').innerText;
      const text = `نتیجه تست قطب‌نمای فکری من در ایسم‌کست: ${title}\n${window.location.href}`;
      navigator.clipboard.writeText(text).then(() => {
        alert("متن و لینک نتیجه کپی شد!");
      });
    }
  </script>

</body>
</html>
