<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تست قطب‌نمای فکری - ایسم‌کست</title>
  
  <!-- کتابخانه html2canvas برای دانلود عکس کارت -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  
  <style>
    :root {
      --bg-color: #0f1218;
      --card-bg: #161a22;
      --accent-color: #58a6ff;
      --text-color: #ffffff;
      --border-color: #30363d;
    }

    body {
      margin: 0;
      padding: 20px;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    .container {
      width: 100%;
      max-width: 500px;
    }

    /* --- بخش سوالات (Quiz Section) --- */
    #quiz-card {
      background-color: var(--card-bg);
      border-radius: 20px;
      padding: 25px;
      border: 1px solid var(--border-color);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }

    .progress-bar-container {
      width: 100%;
      height: 6px;
      background-color: #21262d;
      border-radius: 10px;
      margin-bottom: 20px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background-color: var(--accent-color);
      transition: width 0.3s ease;
    }

    .question-number {
      font-size: 0.85rem;
      color: #8b949e;
      margin-bottom: 10px;
    }

    .question-text {
      font-size: 1.15rem;
      font-weight: 700;
      line-height: 1.6;
      margin-bottom: 25px;
      min-height: 60px;
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option-btn {
      padding: 12px 16px;
      background-color: #21262d;
      color: #c9d1d9;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.95rem;
      font-family: inherit;
      transition: all 0.2s ease;
      text-align: right;
    }

    .option-btn:hover {
      background-color: #30363d;
      border-color: var(--accent-color);
      color: #fff;
    }

    /* --- بخش نتیجه و کارت استوری --- */
    #result-section {
      display: none;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    #export-container {
      width: 100%;
      background-color: var(--card-bg);
      border-radius: 20px;
      padding: 30px 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      text-align: center;
      box-sizing: border-box;
      border: 1px solid var(--border-color);
      position: relative;
      margin-bottom: 20px;
    }

    #export-container * {
      box-sizing: border-box !important;
    }

    .brand-header {
      font-size: 1rem;
      color: #8b949e;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    #result-title {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--accent-color);
      margin: 0 0 15px 0;
    }

    .portrait-wrapper {
      margin: 10px auto;
      width: 100px;
      height: 100px;
      border-radius: 50%;
      overflow: hidden;
      border: 3px solid var(--accent-color);
    }

    .portrait-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* نمودار قطب‌نما */
    .compass-wrapper {
      width: 260px !important;
      height: 260px !important;
      margin: 20px auto !important;
      position: relative;
      background: #1c2128;
      border-radius: 12px;
      border: 2px solid var(--border-color);
    }

    .compass-box {
      width: 100% !important;
      height: 100% !important;
      position: relative;
    }

    .axis-h {
      position: absolute;
      top: 50%;
      left: 0;
      width: 100%;
      height: 2px;
      background-color: #484f58;
    }

    .axis-v {
      position: absolute;
      left: 50%;
      top: 0;
      width: 2px;
      height: 100%;
      background-color: #484f58;
    }

    /* برچسب‌های محورها */
    .label-top { position: absolute; top: 4px; left: 50%; transform: translateX(-50%); font-size: 0.65rem; color: #8b949e; }
    .label-bottom { position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%); font-size: 0.65rem; color: #8b949e; }
    .label-right { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); font-size: 0.65rem; color: #8b949e; }
    .label-left { position: absolute; left: 6px; top: 50%; transform: translateY(-50%); font-size: 0.65rem; color: #8b949e; }

    /* نقطه خروجی روی نمودار */
    .compass-point {
      position: absolute;
      width: 14px;
      height: 14px;
      background-color: #f0883e;
      border: 2px solid #ffffff;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 10px #f0883e;
      top: 50%;
      left: 50%;
      transition: all 0.5s ease;
    }

    .watermark {
      font-size: 0.8rem;
      color: #6e7681;
      margin-top: 15px;
    }

    /* اکشن‌ها و دکمه‌های اشتراک */
    .share-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
    }

    .btn {
      padding: 14px;
      font-size: 1rem;
      font-weight: 700;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-family: inherit;
    }

    .btn-download { background-color: #238636; color: #fff; }
    .btn-download:hover { background-color: #2ea043; }

    .social-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }

    .btn-sec {
      background-color: #21262d;
      color: #c9d1d9;
      border: 1px solid var(--border-color);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- کارت سوالات -->
    <div id="quiz-card">
      <div class="progress-bar-container">
        <div class="progress-bar" id="progress"></div>
      </div>
      <div class="question-number" id="q-number">سوال ۱ از ۶</div>
      <div class="question-text" id="q-text">در حال بارگذاری سوال...</div>
      
      <div class="options-grid">
        <button class="option-btn" onclick="handleAnswer(2)">کاملاً موافقم</button>
        <button class="option-btn" onclick="handleAnswer(1)">موافقم</button>
        <button class="option-btn" onclick="handleAnswer(-1)">مخالفم</button>
        <button class="option-btn" onclick="handleAnswer(-2)">کاملاً مخالفم</button>
      </div>
    </div>

    <!-- کارت نتیجه (پس از پاسخ به همه سوالات) -->
    <div id="result-section">
      <div id="export-container">
        <div class="brand-header">ISMCAST • ایسم‌کست</div>
        <h2 id="result-title">سوسیال دمکرات متمايل به چپ</h2>
        
        <div class="portrait-wrapper">
          <img id="result-portrait" src="figures/marx.png" alt="پرتره" onerror="this.src='https://via.placeholder.com/100';">
        </div>

        <div class="compass-wrapper">
          <div class="compass-box">
            <span class="label-top">اقتدارگرا</span>
            <span class="label-bottom">آزادی‌خواه</span>
            <span class="label-right">راست</span>
            <span class="label-left">چپ</span>
            
            <div class="axis-h"></div>
            <div class="axis-v"></div>
            <div class="compass-point" id="point"></div>
          </div>
        </div>

        <div class="watermark">podcast.ismcast.com | قطب‌نمای فکری</div>
      </div>

      <!-- دکمه‌های دانلود و اشتراک -->
      <div class="share-actions">
        <button class="btn btn-download" onclick="downloadInstagramStory(event)">
          📥 دانلود کارت استوری اینستاگرام
        </button>

        <div class="social-buttons">
          <button class="btn btn-sec" onclick="shareTelegram()">تلگرام</button>
          <button class="btn btn-sec" onclick="shareTwitter()">توییتر</button>
          <button class="btn btn-sec" onclick="copyResultLink()">کپی لینک</button>
        </div>
      </div>
    </div>

  </div>

  <script>
    // بانک سوالات (می‌توانید سوال اضافه کنید)
    // axis: 'econ' (اقتصاد) | 'social' (اجتماعی)
    // weight: 1 (موافقت = راست/اقتدارگرا) | -1 (موافقت = چپ/آزادی‌خواه)
    const questions = [
      {
        text: "دولت باید برای بازدارندگی و کاهش ناعدالتی، بازار و اقتصاد را کنترل کند.",
        axis: "econ",
        weight: -1
      },
      {
        text: "بازار آزاد و رقابت بدون مداخله دولت، بهترین مسیر برای رشد اقتصادی است.",
        axis: "econ",
        weight: 1
      },
      {
        text: "خدمات درمانی و آموزش باید به صورت کاملاً رایگان توسط دولت تامین شود.",
        axis: "econ",
        weight: -1
      },
      {
        text: "برای حفظ نظم و ثبات جامعه، وجود یک حکومت مقتدر و سنتی ضروری است.",
        axis: "social",
        weight: 1
      },
      {
        text: "آزادی‌های فردی و سبک زندگی اشخاص باید بر هرگونه ارزش یا سنت جامعه ارجحیت داشته باشد.",
        axis: "social",
        weight: -1
      },
      {
        text: "امنیت ملی جامعه مهم‌تر از حفظ برخی آزادی‌های مدنی فردی است.",
        axis: "social",
        weight: 1
      }
    ];

    let currentQuestion = 0;
    let econScore = 0;
    let socialScore = 0;

    // نمایش سوال فعلی
    function showQuestion() {
      const q = questions[currentQuestion];
      document.getElementById('q-number').innerText = `سوال ${currentQuestion + 1} از ${questions.length}`;
      document.getElementById('q-text').innerText = q.text;
      
      const progressPercent = ((currentQuestion) / questions.length) * 100;
      document.getElementById('progress').style.width = `${progressPercent}%`;
    }

    // ثبت پاسخ کاربر
    function handleAnswer(value) {
      const q = questions[currentQuestion];
      
      if (q.axis === 'econ') {
        econScore += value * q.weight;
      } else if (q.axis === 'social') {
        socialScore += value * q.weight;
      }

      currentQuestion++;

      if (currentQuestion < questions.length) {
        showQuestion();
      } else {
        renderResult();
      }
    }

    // محاسبه نتیجه و جانمایی نقطه روی قطب‌نما
    function renderResult() {
      document.getElementById('quiz-card').style.display = 'none';
      document.getElementById('result-section').style.display = 'flex';

      // محاسبه موقعیت نقطه (محدوده بین ۱۰% تا ۹۰%)
      const maxEconScore = questions.filter(q => q.axis === 'econ').length * 2;
      const maxSocialScore = questions.filter(q => q.axis === 'social').length * 2;

      // X: چپ (-100%) تا راست (+100%)
      const posX = 50 + (econScore / maxEconScore) * 40; 
      // Y: آزادی‌خواه (-100% پایین) تا اقتدارگرا (+100% بالا)
      const posY = 50 - (socialScore / maxSocialScore) * 40; 

      const point = document.getElementById('point');
      point.style.left = `${posX}%`;
      point.style.top = `${posY}%`;

      // تعیین عنوان و عکس بر اساس ربع قطب‌نما
      const titleElem = document.getElementById('result-title');
      const portraitElem = document.getElementById('result-portrait');

      if (econScore <= 0 && socialScore > 0) {
        titleElem.innerText = "سوسیالیست اقتدارگرا";
        portraitElem.src = "figures/marx.png";
      } else if (econScore > 0 && socialScore > 0) {
        titleElem.innerText = "محافظه‌کار راست‌گرا";
        portraitElem.src = "figures/smith.png";
      } else if (econScore <= 0 && socialScore <= 0) {
        titleElem.innerText = "سوسیال دمکرات / چپ لیبرال";
        portraitElem.src = "figures/sandeers.png";
      } else {
        titleElem.innerText = "لیبرتارین راست‌گرا";
        portraitElem.src = "figures/locke.png";
      }
    }

    // تابع دانلود کارت بدون بهم‌ریختگی در موبایل
    function downloadInstagramStory(e) {
      const exportArea = document.getElementById('export-container');
      const btn = e.currentTarget;
      const originalText = btn.innerText;

      btn.innerText = "⏳ در حال ساخت عکس...";
      btn.disabled = true;

      const originalWidth = exportArea.style.width;
      const originalMaxWidth = exportArea.style.maxWidth;

      // قفل ابعاد به ۵۵۰px برای رندر دقیق روی موبایل
      exportArea.style.width = '550px';
      exportArea.style.maxWidth = 'none';

      html2canvas(exportArea, {
        scale: 2,
        useCORS: true,
        backgroundColor: '#161a22',
        logging: false,
        windowWidth: 1200
      }).then(canvas => {
        exportArea.style.width = originalWidth;
        exportArea.style.maxWidth = originalMaxWidth;

        const link = document.createElement('a');
        link.download = 'IsmCast-Political-Compass.png';
        link.href = canvas.toDataURL('image/png', 1.0);
        link.click();

        btn.innerText = originalText;
        btn.disabled = false;
      }).catch(err => {
        exportArea.style.width = originalWidth;
        exportArea.style.maxWidth = originalMaxWidth;
        console.error("خطا در گرفتن عکس:", err);
        alert("خطایی در ساخت عکس رخ داد.");
        btn.innerText = originalText;
        btn.disabled = false;
      });
    }

    // توابع اشتراک‌گذاری
    function shareTelegram() {
      const title = document.getElementById('result-title').innerText;
      const text = `نتیجه تست قطب‌نمای فکری من در ایسم‌کست: ${title}`;
      window.open(`https://t.me/share/url?url=${encodeURIComponent(window.location.href)}&text=${encodeURIComponent(text)}`, '_blank');
    }

    function shareTwitter() {
      const title = document.getElementById('result-title').innerText;
      const text = `نتیجه تست قطب‌نمای فکری من در ایسم‌کست: ${title}`;
      window.open(`https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}&url=${encodeURIComponent(window.location.href)}`, '_blank');
    }

    function copyResultLink() {
      navigator.clipboard.writeText(window.location.href).then(() => {
        alert("لینک کپی شد!");
      });
    }

    // شروع کوییز
    showQuestion();
  </script>
</body>
</html>
